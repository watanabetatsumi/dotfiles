# 設定参考先：https://qiita.com/kalafinalice/items/c02c0345293fe60af6e5
# 基本設定
## 256色端末を使用する
set -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm:colors=256'
## Escキーの遅延を解消
set -s escape-time 0
## status line を更新する間隔を1秒にする
set-option -g status-interval 1
## ウィンドウのインデックスを1から始める
set -g base-index 1
## ペインのインデックスを1から始める
setw -g pane-base-index 1
## アクティブなペインのみ白っぽく変更（真っ黒は232）
set -g window-style 'bg=colour239'
set -g window-active-style 'bg=colour234'

# キーの割り当て変更
## prefixキーの割り当て(Ctr+a)
## set -g prefix C-a
## prefix + - で上下に分割、prefix + | で左右に分割（新しいペインは今のペインと同じディレクトリで開く）
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
## 従来の prefix + \ でも左右に分割
bind \\ split-window -h -c "#{pane_current_path}"
## prefix + w で新しいウィンドウ（今のペインと同じディレクトリで開く）。prefix + c も同じ
bind w new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
## 本来の prefix + w（ウィンドウ一覧から選ぶ）は prefix + W に移す
bind W choose-tree -Zw
## prefix + h/j/k/l でペインを移動（vim 風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
## prefixなしで分割（Ctrl + - / Ctrl + \）
bind -n C-- split-window -v
bind -n C-_ split-window -v
bind -n C-\\ split-window -h
## ペインの移動をprefixなしで行う（Shift + 矢印キー）
bind -n S-left select-pane -L
bind -n S-down select-pane -D
bind -n S-up select-pane -U
bind -n S-right select-pane -R
## ペインの順次移動をCtr + o に設定
bind -n C-o select-pane -t :.+
## 並列実行のトグル化
bind e setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

# status lineの設定
## window-status を中央揃えで配置する
set-option -g status-justify "centre"
## status line の背景色を指定する。
set-option -g status-bg "colour238"
## status line の文字色を指定する。
set-option -g status-fg "colour255"
## status-left の最大の長さを指定する。
set-option -g status-left-length 20
## status-left のフォーマットを指定する。
set-option -g status-left "#[fg=colour255,bg=colour241]Session: #S #[default]"
## window-status のフォーマットを指定する。
set-window-option -g window-status-format " #I: #W "
## カレントウィンドウの window-status のフォーマットを指定する
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour27,bold] #I: #W #[default]"
## status-right の最大の長さを指定する。
set-option -g status-right-length 60
## status-right のフォーマットを指定する。
### 負荷は uptime から取る（/proc/loadavg は Linux にしか無いので、Mac でも動くように）
set-option -g status-right "#[fg=colour255,bg=colour241] #h | LA: #(uptime | sed -E 's/.*load averages?: //' | tr -d ',') | %m/%d %H:%M:%S#[default]"

# 操作系
## マウス操作を有効化
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
## コマンドモードでの選択方法をvim風に変更
set-window-option -g mode-keys vi
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
## クリップボードとの連携（Mac: pbcopy / WSL: clip.exe / その他の Linux: xclip。tmux 3.2 以上）
if-shell 'command -v pbcopy' "set -s copy-command 'pbcopy'"
if-shell '! command -v pbcopy && command -v clip.exe' "set -s copy-command 'clip.exe'"
if-shell '! command -v pbcopy && ! command -v clip.exe && command -v xclip' "set -s copy-command 'xclip -selection clipboard'"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
